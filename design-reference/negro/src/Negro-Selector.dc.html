<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Selector de gorras · Negro</title>
<!-- runtime del canvas (support.js) no incluido: estos archivos son referencia de diseño -->
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Rock+Salt&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Roboto Mono',monospace;background:#0a0a0c;color:#ffffff}
button,input{font-family:inherit}
button{cursor:pointer}
input::placeholder{color:#8a8a92}
input:focus-visible,button:focus-visible{outline:2px solid #2020f0;outline-offset:2px}
.gbg{position:relative;isolation:isolate;overflow:hidden;background:#111114}
.gbg::before{content:"";position:absolute;inset:-35%;z-index:0;background:radial-gradient(circle at 32% 30%,#ffffff 0,rgba(255,255,255,0.0) 42%),radial-gradient(circle at 72% 72%,#ffffff 0,rgba(255,255,255,0) 50%),linear-gradient(160deg,#f4f4f6 0%,#d9d9df 55%,#b9b9c4 100%)}
.gbg img{position:relative;z-index:1;mix-blend-mode:multiply}
@keyframes drift{from{transform:translate(-6%,-4%) rotate(0deg) scale(1)}to{transform:translate(6%,5%) rotate(28deg) scale(1.12)}}
button.more{background:transparent;color:#ffffff;border:2px solid #2020f0;border-radius:999px;transition:background .15s,color .15s}
button.more:hover{background:#0202ba;color:#ffffff}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pip{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.pop{animation:popIn .32s cubic-bezier(.2,.8,.3,1) both}
.pip{animation:pip .36s cubic-bezier(.3,1.4,.5,1) both}
.bar{transition:transform .22s cubic-bezier(.3,1.5,.5,1),box-shadow .25s,border-color .25s,background .25s}
.bar:active{transform:scale(.97)!important}
@media (prefers-reduced-motion:reduce){.pop,.pip{animation:none}.bar{transition:none}}
button{transition:transform .15s,background .2s,color .2s,border-color .2s}
button:active{transform:scale(.92)}
</style>
</helmet>
<div style="width:358px;box-sizing:border-box;padding:16px;display:flex;flex-direction:column;gap:14px;background:#0a0a0c;border:1px solid rgba(32,32,240,0.49);border-radius:20px">

<div style="display:flex;justify-content:space-between;align-items:baseline">
<span style="font-size:11px;letter-spacing:2px;color:#ffffff">{{title}}</span>
<span style="font-size:11px;color:#b0b0b8">{{count}}</span>
</div>

<div style="display:flex;gap:8px;align-items:center">
<label style="flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;height:44px;box-sizing:border-box;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(32,32,240,0.35)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b0b0b8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
<input type="search" aria-label="Buscar gorra" placeholder="Buscar gorra" value="{{q}}" onInput="{{onQ}}" style="flex:1;min-width:0;background:transparent;border:0;color:#ffffff;font-size:13px;outline:none">
</label>
<button onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" style="flex:none;height:44px;display:flex;align-items:center;gap:6px;padding:0 12px 0 14px;border-radius:999px;background:rgba(32,32,240,0.2);border:1px solid #2020f0;color:#ffffff;font-size:11px;letter-spacing:1px">{{secLabel}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2020f0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
</div>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div class="pop" style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="5">
<button onClick="{{s.pick}}" style="height:36px;padding:0 14px;border-radius:999px;font-size:11px;letter-spacing:1px;color:{{s.color}};background:{{s.bg}};border:1px solid #2020f0">{{s.label}}</button>
</sc-for>
</div>
</sc-if>

<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<div class="pop" style="animation-delay:{{it.delay}}ms;transition:background .25s,border-color .25s;display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;background:{{it.bg}};border:1px solid {{it.ring}}">
<span class="gbg" style="flex:none;width:60px;height:60px;border-radius:12px"><img src="{{it.src}}" alt="" style="width:100%;height:100%;object-fit:contain;display:block"></span>
<span style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px">
<span style="font-size:13px;letter-spacing:.5px">{{it.name}}</span>
<span style="font-size:10px;letter-spacing:1.5px;color:#ffffff">{{it.tag}}</span>
<span style="font-size:12px;color:#e6e6ea">{{it.price}}</span>
</span>
<button onClick="{{it.pick}}" aria-label="{{it.label}}" style="flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid #2020f0;background:{{it.btnBg}};color:{{it.btnColor}};font-size:22px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center">{{it.btnText}}</button>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div style="padding:18px 8px;text-align:center;font-size:12px;color:#b0b0b8">No encontramos gorras con ese nombre.</div></sc-if>
</div>

<sc-if value="{{canMore}}" hint-placeholder-val="{{ true }}">
<button class="more" onClick="{{showMore}}" style="height:48px;font-size:12px;letter-spacing:2.5px">VER MÁS</button>
</sc-if>

<div style="font-size:10px;color:#8a8a92;text-align:center">No incluye la gorra que estás viendo</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"slots":{"editor":"int","default":1,"min":1,"max":2},"onChange":{"editor":null},"$preview":{"width":358,"height":600}}'>
class Component extends DCLogic {
state = { q: '', sec: 0, menuOpen: false, more: false, picks: [] };
renderVals() {
const imgs = ['../../../design-canvas/assets/2-2026-08-14T113841.614.jpg','../../../design-canvas/assets/3_99.jpg','../../../design-canvas/assets/4_92.jpg','../../../design-canvas/assets/5_93.jpg','../../../design-canvas/assets/1_95.jpg'];
const slots = this.props.slots ?? 1;
const caps = [
{ id: 'denim', name: 'Devil Denim', cat: 'Denim', nuevo: 8, ventas: 3 },
{ id: 'pearls', name: 'Pearls', cat: 'Colaboraciones', nuevo: 7, ventas: 6 },
{ id: 'levelup', name: 'Level Up', cat: 'Clásicas', nuevo: 6, ventas: 2 },
{ id: 'av', name: 'El AV', cat: 'Colaboraciones', nuevo: 5, ventas: 1 },
{ id: 'marca', name: 'Marca Registrada', cat: 'Colaboraciones', nuevo: 10, ventas: 4 },
{ id: 'especial', name: 'Edición Especial', cat: 'Clásicas', nuevo: 9, ventas: 8 },
{ id: 'enigma', name: 'Enigma Norteño', cat: 'Colaboraciones', nuevo: 4, ventas: 5 },
{ id: 'cano', name: 'Natanael Cano', cat: 'Colaboraciones', nuevo: 3, ventas: 7 },
].map((c, i) => ({ ...c, src: imgs[i % imgs.length] }));
const secs = ['Más nuevas', 'Best sellers', 'Colaboraciones', 'Denim', 'Clásicas'];
const sec = this.state.sec;
const q = this.state.q.trim().toLowerCase();
let list = caps.filter((c) => !q || c.name.toLowerCase().includes(q));
if (sec === 1) list = list.slice().sort((a, b) => a.ventas - b.ventas);
else { if (sec >= 2) list = list.filter((c) => c.cat === secs[sec]); list = list.slice().sort((a, b) => b.nuevo - a.nuevo); }
const shown = this.state.more ? list : list.slice(0, 5);
const picks = this.state.picks.slice(0, slots);
const toggle = (id) => {
let next = picks.slice();
if (next.includes(id)) next = next.filter((x) => x !== id);
else if (next.length < slots) next.push(id);
else next = [...next.slice(1), id];
this.setState({ picks: next });
if (typeof this.props.onChange === 'function') this.props.onChange(next.map((x) => caps.find((c) => c.id === x)));
};
return {
title: slots === 1 ? 'ELIGE TU GORRA' : 'ELIGE TUS GORRAS',
count: picks.length + ' de ' + slots,
q: this.state.q,
onQ: (e) => this.setState({ q: e.target.value }),
secLabel: secs[sec],
menuOpen: this.state.menuOpen,
toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
sections: secs.map((label, i) => ({ label, bg: i === sec ? '#2020f0' : 'transparent', color: i === sec ? '#ffffff' : '#2020f0', pick: () => this.setState({ sec: i, menuOpen: false, more: false }) })),
items: shown.map((c, idx) => {
const on = picks.includes(c.id);
return {
name: c.name, src: c.src, price: '$999', delay: (this.state.more && idx >= 5 ? idx - 5 : idx) * 50,
tag: c.nuevo >= 9 ? 'NUEVA' : (c.ventas <= 2 ? 'BEST SELLER' : c.cat.toUpperCase()),
bg: on ? 'rgba(32,32,240,0.22)' : 'rgba(255,255,255,.04)',
ring: on ? '#2020f0' : 'rgba(32,32,240,0.25)',
btnText: on ? '✓' : '+', btnBg: on ? '#2020f0' : 'transparent', btnColor: on ? '#ffffff' : '#2020f0',
label: (on ? 'Quitar ' : 'Elegir ') + c.name,
pick: () => toggle(c.id),
};
}),
empty: list.length === 0,
canMore: !this.state.more && list.length > 5,
showMore: () => this.setState({ more: true }),
};
}
}
</script>
</body>
</html>
